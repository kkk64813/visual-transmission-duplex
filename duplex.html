<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cimbar 双工 · 电脑端</title>
<style>
  :root{
    --bg:#f3f6f4; --surface:#fff; --ink:#16211e; --muted:#6d7a75;
    --line:#e1e8e4; --accent:#0e7c66; --accent-deep:#0a5f4f; --accent-soft:#e8f5f0;
    --good:#1f7a4d; --bad:#b4423a; --shadow:0 1px 2px rgba(20,40,35,.04),0 10px 30px rgba(20,40,35,.07);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}

  #bar{
    position:fixed;inset:0 0 auto 0;z-index:10;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 16px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)
  }
  .brand{display:flex;align-items:center;gap:9px;margin-right:6px}
  .mark{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px}
  .mark i{display:block;border-radius:3px;background:var(--accent)}
  .mark i:nth-child(2){opacity:.9;background:var(--accent-deep)}
  .mark i:nth-child(3){opacity:.55;background:var(--accent-deep)}
  .mark i:nth-child(4){background:#9ed4c4}
  .brand strong{font-weight:650;letter-spacing:.01em}

  .stat{display:flex;flex-direction:column;min-width:66px;padding:2px 10px;border-left:1px solid var(--line)}
  .stat b{font-size:10.5px;letter-spacing:.06em;color:var(--muted);font-weight:500;text-transform:uppercase}
  .stat span{font-size:13.5px;font-variant-numeric:tabular-nums}

  #link{display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:#c3cdc8;flex:0 0 7px}
  .dot.on{background:var(--good)} .dot.bad{background:var(--bad)}

  #meter{width:104px;height:7px;background:#eef2f0;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:5px}
  #meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fa37a,#c9a227,#b4423a);transition:width .12s linear}

  .spacer{flex:1 1 auto}
  button{
    font:inherit;font-weight:600;cursor:pointer;border-radius:9px;padding:8px 14px;
    background:var(--surface);color:var(--ink);border:1px solid var(--line);
    transition:background .15s ease,border-color .15s ease,transform .1s ease
  }
  button:hover{background:#f7faf8;border-color:#d2dbd7}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
  button.ghost{background:transparent;color:var(--muted);border-color:transparent}
  button.ghost:hover{background:#f1f5f3;color:var(--ink)}

  #stage{position:fixed;inset:0;padding:64px 16px 16px;display:flex}
  #frame{
    flex:1;display:flex;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);overflow:hidden
  }
  #enc{flex:1;border:0;width:100%;height:100%;background:#fff;display:block}

  #tip{
    position:fixed;left:16px;right:16px;bottom:12px;z-index:9;
    font-size:12.5px;color:var(--muted);text-align:center;pointer-events:none;
    text-shadow:0 1px 0 rgba(255,255,255,.9)
  }

  .folded #bar .stat,.folded #bar #meter,.folded #bar #link{display:none}
  .folded #stage{padding-top:56px}
</style>
</head>
<body>

<div id="bar">
  <div class="brand">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <strong>Cimbar 双工</strong>
  </div>

  <div class="stat">
    <b>双向</b>
    <span id="link"><i class="dot"></i>未开启</span>
  </div>
  <div class="stat"><b>状态包</b><span id="pk">0</span></div>
  <div class="stat"><b>手机 mode</b><span id="md">—</span></div>
  <div class="stat"><b>还差</b><span id="need">—</span></div>
  <div class="stat"><b>帧率</b><span id="fps">15</span></div>
  <div class="stat" style="border-left:0">
    <b>麦克风</b>
    <div id="meter"><i></i></div>
  </div>

  <div class="spacer"></div>

  <button class="primary" id="btnOn">开启双向</button>
  <button id="btnMode" title="开播前把编码模式对齐手机锁定的模式">对齐 mode</button>
  <button class="ghost" id="btnFold">收起</button>
</div>

<div id="stage">
  <div id="frame"><iframe id="enc" src="encoder.html"></iframe></div>
</div>

<div id="tip">手机开 recv.html，点导航里的「双向」开关，就能建立超声回传通道。</div>

<script src="duplex.js"></script>
<script src="duplex-rx.js"></script>
<script>
(function(){
  var enc = document.getElementById('enc');
  var st  = DuplexRx.state;

  window.DuplexUI = function(){
    var link = document.getElementById('link');
    var s = st;

    if (!s.on)            link.innerHTML = '<i class="dot"></i>未开启';
    else if (s.fallback)  link.innerHTML = '<i class="dot bad"></i>失联 · 已回退单向';
    else if (s.packets>0) link.innerHTML = '<i class="dot on"></i>在线';
    else                  link.innerHTML = '<i class="dot"></i>等待手机';

    document.getElementById('pk').textContent = s.packets;
    var ls = s.lastStatus;
    document.getElementById('md').textContent   = ls ? DuplexRx.modeName(ls.mode) : '—';
    document.getElementById('need').textContent = ls ? (ls.need ? ls.need + ' 块' : '—') : '—';
    document.getElementById('fps').textContent  = s.curFps;
  };

  window.DuplexLog = function(msg){
    var t = document.getElementById('tip');
    if (t) t.textContent = msg;
    console.log(msg);
  };

  document.getElementById('btnOn').onclick = async function(){
    var ok = await DuplexRx.start(function(){ return enc.contentWindow; });
    this.textContent = ok ? '双向：开' : '开启失败';
    if (!ok) this.classList.remove('primary');
    DuplexUI();
  };

  document.getElementById('btnMode').onclick = function(){ DuplexRx.applyModeFromPhone(); DuplexUI(); };

  document.getElementById('btnFold').onclick = function(){
    document.body.classList.toggle('folded');
    this.textContent = document.body.classList.contains('folded') ? '展开' : '收起';
  };

  setInterval(function(){
    if (!st.on) return;
    var m = document.querySelector('#meter > i');
    m.style.width = (Math.min(1, st.level * 12) * 100).toFixed(1) + '%';
  }, 120);

  enc.addEventListener('load', DuplexUI);
  DuplexUI();
})();
</script>
</body>
</html>
