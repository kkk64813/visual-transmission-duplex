<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分片合併 · Merge parts</title>
<link rel="stylesheet" href="ui.css">
<style>
  :root{
    --bg:#f5f7f6; --surface:#fff; --ink:#16211e; --muted:#6c7a75;
    --accent:#0e7c66; --accent-2:#0a5f4f; --line:#e1e8e4;
    --shadow:0 2px 14px rgba(20,40,35,.07);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","PingFang SC",sans-serif}
  header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(255,255,255,.92);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px);flex-wrap:wrap}
  .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#0e7c66,#0a5f4f)}
  .brand{font-weight:700}
  .brand small{display:block;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.04em}
  main{max-width:700px;margin:0 auto;padding:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  h3{margin:0 0 10px;font-size:13px;color:var(--accent-2)}
  button{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;
    color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-2)}
  button:disabled{opacity:.45;cursor:not-allowed}
  ol{margin:10px 0 0;padding-left:20px;font-size:13px;color:var(--ink)}
  li{margin:3px 0;word-break:break-all}
  .prog{height:6px;background:#eef3f1;border-radius:6px;overflow:hidden;margin-top:10px}
  .prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
  a{color:var(--accent)}
  footer{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 30px}
</style>
</head>
<body>
<header>
  <div class="mark"></div>
  <div class="brand"><span data-i18n="brand">分片合併</span><small data-i18n="brandSub">全部在本機完成，不上傳</small></div>
  <div style="flex:1"></div>
  <button class="u-topbtn u-lang" onclick="UI.toggle()" title="Language">EN</button>
  <button class="u-topbtn" data-open="dlgHelp" title="說明書">?</button>
  <a class="u-topbtn u-home" href="index.html">⌂ <b data-i18n="nav.home">首頁</b></a>
</header>

<main>
  <div class="card">
    <h3 data-i18n="s1">① 選分片</h3>
    <input type="file" id="files" multiple accept="*/*" style="font-size:13px">
  </div>

  <div class="card">
    <h3 data-i18n="s2">② 檢查順序</h3>
    <ol id="list"><li style="list-style:none;padding:0" data-i18n="empty">還沒選檔案</li></ol>
    <div id="sum" style="font-size:13px;margin-top:6px"></div>
  </div>

  <div class="card">
    <h3 data-i18n="s3">③ 合併</h3>
    <button class="primary" id="btnMerge" disabled onclick="Merge.run()" data-i18n="btn.merge">合併並下載</button>
    <div class="prog"><i id="prog"></i></div>
    <div id="msg" style="font-size:13px;margin-top:8px"></div>
  </div>
</main>

<footer><span id="verStamp"></span></footer>

<div class="u-modal u-hide" id="dlgHelp">
  <div class="u-sheet">
    <div class="u-sheet-head"><span data-i18n="help.t">說明書</span><button class="u-x" data-close="dlgHelp">✕</button></div>
    <div class="u-sheet-body">
      <h4 data-i18n="help.h1">怎麼用</h4>
      <p data-i18n="help.p1">把手機收到的 xxx.part01 / .part02 … 全部選進來（可多選）。按檔名序號排序後拼接，與原檔一字不差。</p>
      <h4 data-i18n="help.h2">注意</h4>
      <p data-i18n="help.p2">分片必須是同一組設定切出來的（同一份檔案、同一個每片大小）。若某片序號對不上，合併出來的檔案會壞；先用接收端把缺的那片補回來，湊齊再合。</p>
    </div>
  </div>
</div>

<script src="ui.js"></script>
<script>
UI.add({
  'nav.home': ['首頁', 'Home'],
  'brand': ['分片合併', 'Merge parts'],
  'brandSub': ['全部在本機完成，不上傳', 'All local, nothing uploaded'],
  's1': ['① 選分片', '1 · Pick parts'],
  's2': ['② 檢查順序', '2 · Check order'],
  's3': ['③ 合併', '3 · Merge'],
  'btn.merge': ['合併並下載', 'Merge & download'],
  'empty': ['還沒選檔案', 'No files yet'],
  'piece': ['第 {n} 片', 'Part {n}'],
  'merging': ['合併中…', 'Merging…'],
  'done': ['完成：', 'Done: '],
  'sum': ['合併後：', 'Merged: '],
  'count': ['共 {n} 片', '{n} parts'],
  'help.t': ['說明書', 'Guide'],
  'help.h1': ['怎麼用', 'How to use'],
  'help.p1': ['把手機收到的 xxx.part01 / .part02 … 全部選進來（可多選）。按檔名序號排序後拼接，與原檔一字不差。',
    'Select every xxx.part01 / .part02 … received on the phone (multi-select works). They are sorted by part number and joined byte-for-byte.'],
  'help.h2': ['注意', 'Caution'],
  'help.p2': ['分片必須是同一組設定切出來的（同一份檔案、同一個每片大小）。若某片序號對不上，合併出來的檔案會壞；先用接收端把缺的那片補回來，湊齊再合。',
    'All parts must come from the same settings. A missing or mismatched part corrupts the result — fetch it again from the receiver first.']
});
UI.apply();
</script>

<script>
var Merge = (function () {
  var picked = [];

  function sortKey(name) {
    var m = name.match(/\.part(\d+)/i);
    return m ? parseInt(m[1], 10) : 9999;
  }

  function render() {
    var list = document.getElementById('list');
    var sum = document.getElementById('sum');
    var btn = document.getElementById('btnMerge');
    list.innerHTML = '';
    if (!picked.length) {
      list.innerHTML = '<li style="list-style:none;padding:0">' + UI.t('empty') + '</li>';
      sum.textContent = '';
      btn.disabled = true;
      return;
    }
    var pn = UI.t('piece');
    picked.forEach(function (f, i) {
      var li = document.createElement('li');
      li.textContent = pn.replace('{n}', i + 1) + ' · ' + f.name + ' · ' + fmt(f.size);
      list.appendChild(li);
    });
    var total = picked.reduce(function (a, b) { return a + b.size; }, 0);
    var base = picked[0].name.replace(/\.part\d+/i, '');
    sum.textContent = UI.t('sum') + base + ' · ' + fmt(total) + ' · ' + UI.t('count').replace('{n}', picked.length);
    btn.disabled = false;
  }

  function fmt(n) {
    if (n > 1024 * 1024) return (n / 1024 / 1024).toFixed(2) + ' MB';
    if (n > 1024) return (n / 1024).toFixed(1) + ' KB';
    return n + ' B';
  }

  document.getElementById('files').addEventListener('change', function () {
    picked = Array.prototype.slice.call(this.files || []);
    picked.sort(function (a, b) {
      var ka = sortKey(a.name), kb = sortKey(b.name);
      return ka - kb || a.name.localeCompare(b.name);
    });
    render();
  });

  window.addEventListener('ui-lang', render);

  return {
    run: function () {
      if (!picked.length) return;
      var btn = document.getElementById('btnMerge');
      var msg = document.getElementById('msg');
      var prog = document.getElementById('prog');
      btn.disabled = true;
      msg.textContent = UI.t('merging');
      var base = picked[0].name.replace(/\.part\d+/i, '');
      var blob = new Blob(picked, { type: 'application/octet-stream' });
      var url = URL.createObjectURL(blob);
      prog.style.width = '100%';
      var a = document.createElement('a');
      a.href = url;
      a.download = base || 'merged.bin';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { document.body.removeChild(a); }, 500);
      msg.innerHTML = UI.t('done') + '<a href="' + url + '" download="' + (base || 'merged.bin') + '">' + (base || 'merged.bin') + '</a>（' + fmt(blob.size) + '）';
      btn.disabled = false;
    }
  };
})();
</script>
</body>
</html>
