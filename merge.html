<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分片合并 · Merge parts</title>
<style>
  :root{
    --bg:#f5f7f6; --surface:#fff; --ink:#16211e; --muted:#6c7a75;
    --accent:#0e7c66; --accent-2:#0a5f4f; --line:#e1e8e4; --warn-bg:#fdf6e7;
    --shadow:0 2px 14px rgba(20,40,35,.07);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:rgba(255,255,255,.92);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
  .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#0e7c66,#0a5f4f)}
  .brand{font-weight:700}
  .brand small{display:block;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.04em}
  main{max-width:700px;margin:0 auto;padding:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  h3{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  button{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;
    color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-2)}
  button:disabled{opacity:.45;cursor:not-allowed}
  ol{margin:10px 0 0;padding-left:20px;font-size:13px;color:var(--muted)}
  li{margin:3px 0;word-break:break-all}
  .hint{font-size:12px;color:var(--muted);line-height:1.75;margin-top:8px}
  .warn{background:var(--warn-bg);border:1px solid #f0e2c4;color:#7a5416;border-radius:10px;
    padding:10px 12px;font-size:13px;line-height:1.7;margin-bottom:12px}
  .prog{height:6px;background:#eef3f1;border-radius:6px;overflow:hidden;margin-top:10px}
  .prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
  a{color:var(--accent)}
  footer{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 30px}
</style>
</head>
<body>
<header>
  <div class="mark"></div>
  <div class="brand">分片合并<small>Merge · 全部在本地完成，不上传</small></div>
</header>

<main>
  <div class="card">
    <h3>1 选分片</h3>
    <input type="file" id="files" multiple accept="*/*" style="font-size:13px">
    <div class="hint">把手机收到的 <b>xxx.part01 / .part02 …</b> 全部选进来（可以多选）。按文件名排序后拼接，和原档一字不差。</div>
  </div>

  <div class="card">
    <h3>2 检查顺序</h3>
    <ol id="list"><li style="list-style:none;padding:0">还没选文件</li></ol>
    <div class="hint" id="sum"></div>
  </div>

  <div class="card">
    <h3>3 合并</h3>
    <button class="primary" id="btnMerge" disabled onclick="Merge.run()">合并并下载</button>
    <div class="prog"><i id="prog"></i></div>
    <div class="hint" id="msg"></div>
  </div>

  <div class="warn">
    分片必须是同一档设置下切出来的（同一份文件、同一个每片大小）。如果某一片的序号对不上，
    合并出来的文件会坏——先用接收端把缺的那片补回来，凑齐再合并。
  </div>
</main>

<footer>返回 <a href="./index.html">首页</a> · 发送端见 <a href="./duplex.html">duplex</a></footer>

<script>
var Merge = (function () {
  var picked = [];

  function sortKey(name) {
    var m = name.match(/\.part(\d+)/i);
    return m ? parseInt(m[1], 10) : 9999;
  }

  function render() {
    var list = document.getElementById('list');
    var sum = document.getElementById('sum');
    var btn = document.getElementById('btnMerge');
    list.innerHTML = '';
    if (!picked.length) {
      list.innerHTML = '<li style="list-style:none;padding:0">还没选文件</li>';
      sum.textContent = '';
      btn.disabled = true;
      return;
    }
    picked.forEach(function (f, i) {
      var li = document.createElement('li');
      li.textContent = '第 ' + (i + 1) + ' 片 · ' + f.name + ' · ' + fmt(f.size);
      list.appendChild(li);
    });
    var total = picked.reduce(function (a, b) { return a + b.size; }, 0);
    var base = picked[0].name.replace(/\.part\d+/i, '');
    sum.textContent = '合并后：' + base + ' · ' + fmt(total) + ' · 共 ' + picked.length + ' 片';
    btn.disabled = false;
  }

  function fmt(n) {
    if (n > 1024 * 1024) return (n / 1024 / 1024).toFixed(2) + ' MB';
    if (n > 1024) return (n / 1024).toFixed(1) + ' KB';
    return n + ' B';
  }

  document.getElementById('files').addEventListener('change', function () {
    picked = Array.prototype.slice.call(this.files || []);
    picked.sort(function (a, b) {
      var ka = sortKey(a.name), kb = sortKey(b.name);
      return ka - kb || a.name.localeCompare(b.name);
    });
    render();
  });

  return {
    run: function () {
      if (!picked.length) return;
      var btn = document.getElementById('btnMerge');
      var msg = document.getElementById('msg');
      var prog = document.getElementById('prog');
      btn.disabled = true;
      msg.textContent = '合并中…';
      var base = picked[0].name.replace(/\.part\d+/i, '');
      var blob = new Blob(picked, { type: 'application/octet-stream' });
      var url = URL.createObjectURL(blob);
      prog.style.width = '100%';
      var a = document.createElement('a');
      a.href = url;
      a.download = base || 'merged.bin';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { document.body.removeChild(a); }, 500);
      msg.innerHTML = '完成：<a href="' + url + '" download="' + (base || 'merged.bin') + '">' + (base || 'merged.bin') + '</a>（' + fmt(blob.size) + '）';
      btn.disabled = false;
    }
  };
})();
</script>
</body>
</html>
