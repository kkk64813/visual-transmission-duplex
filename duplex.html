<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cimbar 双工 · 电脑端</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#cfe3ff}
  #enc{position:fixed;inset:0 0 96px 0;border:0;width:100%;height:calc(100% - 96px);background:#000}
  #bar{position:fixed;left:0;right:0;bottom:0;height:96px;
    background:rgba(8,10,14,.92);border-top:1px solid #1d2530;
    display:flex;align-items:center;gap:14px;padding:0 16px;backdrop-filter:blur(6px)}
  .pill{display:flex;flex-direction:column;justify-content:center;min-width:96px}
  .pill b{font-size:11px;color:#7d8b9c;font-weight:400}
  .pill span{font-size:15px;font-variant-numeric:tabular-nums}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .dot.off{background:#555} .dot.on{background:#2ea043} .dot.bad{background:#f85149}
  button{background:#1b2430;color:#cfe3ff;border:1px solid #2a3542;border-radius:8px;
    padding:9px 14px;font-size:13px;cursor:pointer}
  button:hover{background:#243040}
  button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
  button.ghost{background:transparent}
  #meter{width:120px;height:10px;background:#121821;border:1px solid #24303d;border-radius:6px;overflow:hidden}
  #meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ea043,#d29922,#f85149)}
  #tip{position:fixed;left:16px;bottom:104px;right:16px;font-size:12px;color:#8b97a5;pointer-events:none}
  #mini{position:fixed;right:14px;bottom:104px;display:none}
  .folded #bar{height:40px} .folded #enc{height:calc(100% - 40px)}
  .folded .pill,.folded #meter,.folded #auth{display:none}
</style>
</head>
<body>

<iframe id="enc" src="encoder.html"></iframe>

<div id="tip">手机端打开 recv.html，点导航里的「双向」开关即可建立反向超声通道。</div>

<div id="bar">
  <div class="pill">
    <b>双向状态</b>
    <span id="link"><i class="dot off"></i>未开启</span>
  </div>
  <div class="pill">
    <b>状态包</b>
    <span id="pk">0</span>
  </div>
  <div class="pill">
    <b>手机 mode</b>
    <span id="md">—</span>
  </div>
  <div class="pill">
    <b>还差</b>
    <span id="need">—</span>
  </div>
  <div class="pill">
    <b>当前帧率</b>
    <span id="fps">15</span>
  </div>
  <div class="pill">
    <b>麦克风电平</b>
    <div id="meter"><i></i></div>
  </div>
  <button class="primary" id="btnOn">开启双向</button>
  <button id="btnMode" title="开播前把编码模式对齐手机锁定的模式">对齐 mode</button>
  <button class="ghost" id="btnFold">收起</button>
</div>

<script src="duplex.js"></script>
<script src="duplex-rx.js"></script>
<script>
(function(){
  var enc = document.getElementById('enc');
  var st  = DuplexRx.state;

  function spin(el){ return el.querySelector('.dot'); }

  window.DuplexUI = function(){
    var s = st;
    var link = document.getElementById('link');
    var dot = link.querySelector('.dot');
    if (!s.on) { dot.className = 'dot off'; link.innerHTML = '<i class="dot off"></i>未开启'; }
    else if (s.fallback) { dot.className = 'dot bad'; link.innerHTML = '<i class="dot bad"></i>失联 · 已回退单向'; }
    else if (s.packets > 0) { dot.className = 'dot on'; link.innerHTML = '<i class="dot on"></i>在线'; }
    else { dot.className = 'dot'; link.innerHTML = '<i class="dot"></i>等待手机'; }

    document.getElementById('pk').textContent = s.packets;
    var ls = s.lastStatus;
    document.getElementById('md').textContent = ls ? (DuplexRx.modeName(ls.mode) + ' (' + ls.mode + ')') : '—';
    document.getElementById('need').textContent = ls ? (ls.need ? ls.need + ' 块' : '—') : '—';
    document.getElementById('fps').textContent = s.curFps;

    var m = document.getElementById('meter').querySelector('i');
    var lv = Math.min(1, s.level * 12);
    m.style.width = (lv * 100).toFixed(1) + '%';
    s.peak = 0;   // 峰值按帧清零，避免一直停在历史最大值
  };

  window.DuplexLog = function(msg){
    var t = document.getElementById('tip');
    if (t) { t.textContent = msg; t.style.color = '#9fb4cc'; }
    console.log(msg);
  };

  function target(){ return { Main: enc.contentWindow.Main, isPaused: function(){ return enc.contentWindow.Main.isPaused(); } }; }

  document.getElementById('btnOn').onclick = async function(){
    var ok = await DuplexRx.start(function(){ return enc.contentWindow; });
    this.textContent = ok ? '双向：开' : '开启失败';
    if (!ok) this.classList.remove('primary');
    DuplexUI();
  };

  document.getElementById('btnMode').onclick = function(){ DuplexRx.applyModeFromPhone(); DuplexUI(); };

  document.getElementById('btnFold').onclick = function(){
    document.body.classList.toggle('folded');
    this.textContent = document.body.classList.contains('folded') ? '展开' : '收起';
  };

  // 电平表刷新（独立于状态包节拍，方便自检时看"到底有没有听到"）
  setInterval(function(){
    if (st.on) {
      var m = document.getElementById('meter').querySelector('i');
      m.style.width = (Math.min(1, st.level * 12) * 100).toFixed(1) + '%';
    }
  }, 120);

  enc.addEventListener('load', function(){ DuplexUI(); });
  DuplexUI();
})();
</script>
</body>
</html>
